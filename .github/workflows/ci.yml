name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://stickerfolio:ci-only@localhost:5432/stickerfolio
      APP_BASE_URL: http://localhost:3500
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      REGISTRATION_MODE: closed
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deployment:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Compose configuration
        run: cp .env.example .env
      - name: Verify the external database deployment shape and secure TLS default
        run: |
          docker compose --file compose.external.yml config --format json > /tmp/external-compose.json
          node -e '
            const config = require("/tmp/external-compose.json");
            const names = Object.keys(config.services).sort();
            if (JSON.stringify(names) !== JSON.stringify(["app", "migrate"])) process.exit(1);
            if (names.some((name) => config.services[name].environment.DATABASE_SSL_MODE !== "verify-full")) {
              process.exit(1);
            }
          '
      - name: Run the one-command first start
        run: ./start.sh
      - name: Verify application readiness and empty catalog availability
        run: |
          curl --fail --silent http://localhost:3500/api/health/ready
          curl --fail --silent http://localhost:3500/api/version
          test "$(docker compose exec -T postgres psql --username stickerfolio --dbname stickerfolio --tuples-only --no-align --command "SELECT count(*) FROM albums WHERE slug = 'panini-world-cup-2026'")" = "1"
          test "$(docker compose exec -T postgres psql --username stickerfolio --dbname stickerfolio --tuples-only --no-align --command "SELECT count(*) FROM collector_profiles")" = "0"
          test "$(docker compose exec -T postgres psql --username stickerfolio --dbname stickerfolio --tuples-only --no-align --command "SELECT count(*) FROM holdings")" = "0"
      - name: Verify standalone and operations image contents
        run: |
          docker run --rm --entrypoint sh stickerfolio:local -c \
            'test -f /app/server.js && test ! -e /app/src && test ! -e /app/scripts && test ! -e /app/node_modules/tsx'
          docker run --rm --entrypoint sh stickerfolio-operations:local -c \
            'test -f /app/scripts/migrate.ts && test -d /app/src && test -f /app/node_modules/tsx/dist/cli.mjs'
          app_size="$(docker image inspect stickerfolio:local --format '{{.Size}}')"
          operations_size="$(docker image inspect stickerfolio-operations:local --format '{{.Size}}')"
          test "$app_size" -lt "$operations_size"
          printf 'Standalone runtime: %s bytes; operations image: %s bytes\n' "$app_size" "$operations_size"
      - name: Verify persistent data survives an app rebuild
        run: docker compose up -d --build app
      - name: Back up and restore into an empty database
        run: |
          ./scripts/postgres-backup.sh --compose /tmp/stickerfolio.dump
          docker compose exec -T postgres createdb --username stickerfolio stickerfolio_restore
          POSTGRES_DB=stickerfolio_restore ./scripts/postgres-restore.sh --compose /tmp/stickerfolio.dump
          docker compose exec -T postgres psql --username stickerfolio --dbname stickerfolio_restore --tuples-only --command "SELECT count(*) FROM schema_migrations"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Remove test deployment
        if: always()
        run: docker compose down --volumes

  mobile-e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://stickerfolio:ci-only@localhost:5432/stickerfolio
      DATABASE_SSL_MODE: disable
      APP_BASE_URL: http://localhost:3500
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      REGISTRATION_MODE: closed
      E2E_BASE_URL: http://localhost:3500
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stickerfolio
          POSTGRES_USER: stickerfolio
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stickerfolio -d stickerfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check the end-to-end suite
        run: pnpm exec tsc -p e2e/tsconfig.json --noEmit
      - name: Apply migrations and create the bootstrap admin
        run: pnpm db:migrate
      - name: Seed the World Cup 2026 catalog
        run: pnpm seed:wm2026
      - name: Seed deterministic end-to-end fixtures
        run: pnpm seed:e2e
      - name: Build the application
        run: pnpm build
      - name: Install the Playwright Chromium browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the mobile acceptance suite
        run: pnpm test:e2e
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

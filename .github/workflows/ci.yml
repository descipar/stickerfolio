name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://stickerfolio:ci-only@localhost:5432/stickerfolio
      APP_BASE_URL: http://localhost:3500
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      REGISTRATION_MODE: closed
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deployment:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Compose configuration
        run: cp .env.example .env
      - name: Verify the external database deployment has no bundled PostgreSQL service
        run: test "$(docker compose --file compose.external.yml config --services | tr '\n' ' ')" = "migrate app "
      - name: Run the one-command first start
        run: ./start.sh
      - name: Verify application readiness and empty catalog availability
        run: |
          curl --fail --silent http://localhost:3500/api/health/ready
          test "$(docker compose exec -T postgres psql --username stickerfolio --dbname stickerfolio --tuples-only --no-align --command "SELECT count(*) FROM albums WHERE slug = 'panini-world-cup-2026'")" = "1"
          test "$(docker compose exec -T postgres psql --username stickerfolio --dbname stickerfolio --tuples-only --no-align --command "SELECT count(*) FROM collector_profiles")" = "0"
          test "$(docker compose exec -T postgres psql --username stickerfolio --dbname stickerfolio --tuples-only --no-align --command "SELECT count(*) FROM holdings")" = "0"
      - name: Verify persistent data survives an app rebuild
        run: docker compose up -d --build app
      - name: Back up and restore into an empty database
        run: |
          ./scripts/postgres-backup.sh --compose /tmp/stickerfolio.dump
          docker compose exec -T postgres createdb --username stickerfolio stickerfolio_restore
          POSTGRES_DB=stickerfolio_restore ./scripts/postgres-restore.sh --compose /tmp/stickerfolio.dump
          docker compose exec -T postgres psql --username stickerfolio --dbname stickerfolio_restore --tuples-only --command "SELECT count(*) FROM schema_migrations"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Remove test deployment
        if: always()
        run: docker compose down --volumes

  mobile-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      DATABASE_URL: postgresql://stickerfolio:ci-only@localhost:5432/stickerfolio
      DATABASE_SSL_MODE: disable
      APP_BASE_URL: http://localhost:3500
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      REGISTRATION_MODE: closed
      E2E_BASE_URL: http://localhost:3500
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stickerfolio
          POSTGRES_USER: stickerfolio
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stickerfolio -d stickerfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add the Playwright test runner
        # Pinned and installed here rather than committed to the root manifest so
        # the unchanged quality job keeps its frozen lockfile intact.
        run: pnpm add -D @playwright/test@1.61.1
      - name: Type-check the end-to-end suite
        run: pnpm exec tsc -p e2e/tsconfig.json --noEmit
      - name: Apply migrations and create the bootstrap admin
        run: pnpm db:migrate
      - name: Seed the World Cup 2026 catalog
        run: pnpm seed:wm2026
      - name: Seed deterministic end-to-end fixtures
        run: pnpm seed:e2e
      - name: Build the application
        run: set -o pipefail; pnpm build 2>&1 | tee -a /tmp/e2e.log
      - name: Install the Playwright Chromium browser
        run: set -o pipefail; pnpm exec playwright install --with-deps chromium 2>&1 | tee -a /tmp/e2e.log
      - name: Run the mobile acceptance suite
        run: set -o pipefail; pnpm test:e2e 2>&1 | tee -a /tmp/e2e.log
      - name: Report diagnostic output on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          body="$(tail -c 8000 /tmp/e2e.log 2>/dev/null || echo 'no /tmp/e2e.log produced')"
          jq -n --arg b "$body" '{body: ("<!--e2e-diagnostic-->\n```\n" + $b + "\n```")}' > /tmp/comment.json
          if [ -n "$PR" ]; then
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/issues/$PR/comments" -d @/tmp/comment.json > /dev/null
          fi
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

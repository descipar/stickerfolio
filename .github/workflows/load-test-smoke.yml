# OPTIONAL, NON-GATING load-test smoke (issue #43 / Roadmap 12.3).
#
# It proves the k6 load test and its deterministic seed run end-to-end against a
# docker-compose deployment (mirroring the `deployment` job in ci.yml). It runs a
# REDUCED smoke (few users, short duration) and deliberately does NOT enforce the
# strict p95 latency thresholds: a GitHub-hosted runner is NOT the target
# hardware (Raspberry Pi 4 baseline, see load-test/README.md), so its latency
# numbers are not authoritative. The smoke only fails on functional regressions
# (domain errors, lost updates, failed checks).
#
# This workflow is separate from ci.yml on purpose so the existing quality and
# deployment jobs are unaffected and this check is not a required merge gate.
name: Load test smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "load-test/**"
      - ".github/workflows/load-test-smoke.yml"

permissions:
  contents: read

jobs:
  load-test-smoke:
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: http://localhost:3500
      AUTH_TRUSTED_IP_HEADER: x-load-test-ip
      POSTGRES_PASSWORD: load-test-only-password
      BETTER_AUTH_SECRET: load-test-only-secret-with-at-least-32-characters
      DATABASE_URL: postgresql://stickerfolio:load-test-only-password@localhost:5432/stickerfolio
      DATABASE_SSL_MODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Prepare Compose configuration
        run: |
          cp .env.example .env
          {
            echo "APP_BASE_URL=${APP_BASE_URL}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}"
            echo "AUTH_TRUSTED_IP_HEADER=${AUTH_TRUSTED_IP_HEADER}"
            echo "REGISTRATION_MODE=closed"
          } >> .env

      - name: Start the app via Docker Compose (DB port published for seeding)
        run: docker compose -f compose.yml -f load-test/compose.loadtest.yml up --detach --build

      - name: Wait for application readiness
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:3500/api/health/ready >/dev/null; then
              echo "ready"; exit 0
            fi
            sleep 3
          done
          echo "app did not become ready"; docker compose logs; exit 1

      - name: Seed a reduced load dataset (reuses the app's seed/registration paths)
        env:
          LOAD_USERS: "8"
        run: pnpm exec tsx load-test/seed/seed-load-dataset.ts

      - name: Capture EXPLAIN ANALYZE of the critical queries
        run: EXPLAIN_OUT=load-test/results/ci-explain-analyze.txt pnpm exec tsx load-test/scripts/run-explain.ts

      - name: Install k6
        run: |
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run reduced k6 smoke (functional only; p95 NOT gated on this hardware)
        run: |
          k6 run \
            --env MODE=smoke \
            --env BASE_URL=http://localhost:3500 \
            --env TRUSTED_IP_HEADER=${AUTH_TRUSTED_IP_HEADER} \
            --summary-export=load-test/results/ci-k6-summary.json \
            load-test/k6/load-test.js

      - name: Upload load-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-smoke-results
          path: load-test/results/
          if-no-files-found: ignore

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes
